name: Auto Bikin Web Transkrip
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install PDF tools
        run: pip install PyMuPDF
      - name: Ekstrak PDF jadi TXT & HTML
        run: |
          python3 -c "
          import fitz, os, pathlib
          html = '<html><head><title>Arsip Dokumen PBB</title></head><body><h1>Arsip Otomatis - Bisa Dibaca AI</h1>'
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.endswith('.pdf'):
                      path = os.path.join(root,f)
                      try:
                          doc = fitz.open(path)
                          text = '\n'.join([page.get_text() for page in doc][:3]) # ambil 3 halaman pertama
                          txt_path = path.replace('.pdf','.txt')
                          open(txt_path,'w',encoding='utf-8').write(text)
                          html += f'<h2>{f}</h2><a href={path}>Download PDF</a><pre>{text[:2000]}</pre><hr>'
                      except: pass
          html += '</body></html>'
          open('index.html','w',encoding='utf-8').write(html)
          "
      - name: Commit hasil
        run: |
          git config --global user.name 'bot-transkrip'
          git config --global user.email 'bot@github.com'
          git add .
          git commit -m 'Auto transkrip PDF' || true
          git push
